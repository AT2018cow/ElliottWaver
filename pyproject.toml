[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elliottwaver"
version = "0.6.0"
description = "Reproducible Elliott wave analysis for A-share and US equities"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3", "pydantic-settings>=2.5,<3", "numpy>=1.26,<3",
  "pandas>=2.2,<3", "PyYAML>=6,<7", "requests>=2.32,<3",
  "rich>=13,<16", "matplotlib>=3.8,<4", "pyarrow>=17",
  "typer>=0.15,<1", "plotly>=6,<7", "exchange-calendars>=4.5,<5",
]

[project.optional-dependencies]
cn = ["akshare>=1.18,<2", "baostock>=0.8,<1"]
us = ["alpaca-py>=0.30,<1"]
png = ["kaleido>=1,<2"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
elliottwaver = "elliottwaver.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: opt-in live market data checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
