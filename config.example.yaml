schema_version: 1
analysis:
  timeframe: 1d
  top_k: 3
  history_years: 5
  min_anchor_bars: 60
  max_analysis_bars: 600
  max_anchors: 4
  anchor_mode: recent
  warmup_bars: 130
  scales: [1.4, 2.4, 3.8]
  macro_scale: 4.0
search:
  beam_width: 128
  max_expansions: 50000
  max_bridge_intervals: 5
  max_subwave_depth: 0
scoring:
  profile: ew_score_v2
  min_quality: 40
  unclear_below: 45
  min_coverage: 0.70
  temperature: 12.0
index_guidance:
  enabled: true
  short_sessions: 5
  swing_sessions: 20
  activation_sessions: 2
  daily_trigger: close
  near_atr: 0.5
  max_chase_atr: 0.5
  near_tie_score: 3.0
  near_tie_min_coverage: 0.70
  market_context: true
  event_context: true
  references: {}  # 例如 {"000688.SH": "000300.SH"}
  context_files: {}  # 主指数代码对应本地 1.0 版事件与成分 JSON
  context_sessions: 20
  min_volatility_windows: 20
  breadth_min_coverage: 0.70
  intraday_tracking: true
  intraday_trigger_timeframe: 15m
  intraday_trigger: CLOSE  # CLOSE | TOUCH | RETEST
  retest_tolerance_points: 0
  intraday_max_age_minutes: 45
  background_max_age_minutes: 180
  volume_history_sessions: 20
  min_volume_sessions: 5
data:
  us_feed: sip
  us_equity_feed: alpaca  # alpaca | yahoo
  us_index_feed: ""  # "" | massive-index | yahoo-index
  cn_equity_intraday_feed: sina
  cn_index_intraday_feed: ""  # "" | tushare-cn-index | tencent-cn-index
  tencent_max_pages: 20
  request_timeout_seconds: 20
  max_attempts: 3
  total_fetch_deadline_seconds: 120
  max_requests_per_second: 2
  delayed_access_buffer_minutes: 20
  cache_ttl_seconds: 21600
cache:
  directory: .cache/elliottwaver
output:
  directory: reports
  formats: [html, md]
