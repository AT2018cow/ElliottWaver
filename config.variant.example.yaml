analysis:
  engine_profile: hierarchical_v1
  scales: [0.5, 1.0, 1.4, 2.4, 3.8, 8.0]
  top_k: 20
search:
  max_subwave_depth: 2
  max_expansions: 100000
  beam_width: 1024
  max_bridge_intervals: 21
scoring:
  min_quality: 0
  min_coverage: 0.1
  unclear_below: 0
cache:
  directory: .cache/wave-engine-variants
output:
  directory: reports/wave-engine/variants
  formats: [md]
